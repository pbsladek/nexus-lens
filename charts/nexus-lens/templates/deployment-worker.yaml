apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-lens.fullname" . }}-worker
  labels:
    {{- include "nexus-lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "nexus-lens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "nexus-lens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "nexus-lens.workerImage" . | quote }}
          imagePullPolicy: {{ include "nexus-lens.workerImagePullPolicy" . | quote }}
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.hostKey }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.portKey }}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.databaseKey }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.usernameKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.passwordKey }}
            - name: PGSSLMODE
              value: {{ .Values.postgres.sslMode | quote }}
            - name: NEXUS_LENS_RETENTION_INTERVAL_SECONDS
              value: {{ .Values.worker.retention.intervalSeconds | quote }}
            - name: NEXUS_LENS_RETENTION_SCAN_RUN_DAYS
              value: {{ .Values.worker.retention.scanRunDays | quote }}
            - name: NEXUS_LENS_RETENTION_CLEANUP_EXECUTION_DAYS
              value: {{ .Values.worker.retention.cleanupExecutionDays | quote }}
            - name: NEXUS_LENS_RETENTION_VERIFICATION_FINDING_DAYS
              value: {{ .Values.worker.retention.verificationFindingDays | quote }}
            - name: NEXUS_LENS_RETENTION_TREND_SNAPSHOT_DAYS
              value: {{ .Values.worker.retention.trendSnapshotDays | quote }}
            {{ if .Values.nexus.credentials.existingSecret }}
            - name: NEXUS_LENS_NEXUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nexus.credentials.existingSecret }}
                  key: {{ .Values.nexus.credentials.usernameKey }}
            - name: NEXUS_LENS_NEXUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nexus.credentials.existingSecret }}
                  key: {{ .Values.nexus.credentials.passwordKey }}
            {{ end }}
            - name: NEXUS_LENS_ENABLE_DESTRUCTIVE_CLEANUP
              value: {{ .Values.cleanup.destructiveExecution.enabled | quote }}
            - name: NEXUS_LENS_CLEANUP_DELETE_RPS
              value: {{ .Values.cleanup.destructiveExecution.deleteRPS | quote }}
            - name: NEXUS_LENS_CLEANUP_MAINTENANCE_START_UTC
              value: {{ .Values.cleanup.destructiveExecution.maintenanceWindowUTC.start | quote }}
            - name: NEXUS_LENS_CLEANUP_MAINTENANCE_END_UTC
              value: {{ .Values.cleanup.destructiveExecution.maintenanceWindowUTC.end | quote }}
