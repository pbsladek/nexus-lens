apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-lens.fullname" . }}
  labels:
    {{- include "nexus-lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "nexus-lens.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
