apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-lens.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "nexus-lens.name" . }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "nexus-lens.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
