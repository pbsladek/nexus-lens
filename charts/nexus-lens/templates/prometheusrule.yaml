{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nexus-lens.fullname" . }}
  labels:
    {{- include "nexus-lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- with .Values.metrics.prometheusRule.labels }}
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
  groups:
    - name: nexus-lens.indexing
      rules:
        - alert: NexusLensQueueBacklogOld
          expr: nexus_lens_queue_oldest_pending_age_seconds_by_nexus > {{ .Values.metrics.prometheusRule.queueAgeSeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Nexus Lens indexing queue has old pending work for a Nexus instance
        - alert: NexusLensIndexingScheduleStale
          expr: nexus_lens_indexing_schedule_stale_age_seconds > {{ .Values.metrics.prometheusRule.staleScheduleAgeSeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Nexus Lens indexing schedule is overdue
        - alert: NexusLensFailedRuns
          expr: sum(nexus_lens_scan_runs_24h{status="failed"}) >= {{ .Values.metrics.prometheusRule.failedRuns24h }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Nexus Lens has failed index runs in the last 24 hours
        - alert: NexusLensHighVerificationFindings
          expr: sum(nexus_lens_verification_findings{status="open",severity="high"}) >= {{ .Values.metrics.prometheusRule.highVerificationFindings }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Nexus Lens has high severity open verification findings
        - alert: NexusLensCleanupExecutionStuck
          expr: nexus_lens_cleanup_oldest_running_age_seconds > {{ .Values.metrics.prometheusRule.cleanupRunningAgeSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Nexus Lens cleanup execution has been running for too long
        - alert: NexusLensCleanupExecutionFailures
          expr: sum(nexus_lens_cleanup_executions{status="failed"}) >= {{ .Values.metrics.prometheusRule.cleanupFailedExecutions }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Nexus Lens has failed cleanup executions
{{- end }}
