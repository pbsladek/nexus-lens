image:
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 5601
  image:
    repository: ghcr.io/example/nexus-lens-api
    tag: ""
    pullPolicy: ""

worker:
  replicas: 1
  image:
    repository: ghcr.io/example/nexus-lens-worker
    tag: ""
    pullPolicy: ""
  retention:
    intervalSeconds: 3600
    scanRunDays: 30
    cleanupExecutionDays: 365
    verificationFindingDays: 180
    trendSnapshotDays: 365

nexus:
  credentials:
    existingSecret: ""
    usernameKey: username
    passwordKey: password

cleanup:
  destructiveExecution:
    enabled: false
    deleteRPS: 0.5
    maintenanceWindowUTC:
      start: ""
      end: ""

postgres:
  existingSecret: nexus-lens-postgres
  hostKey: host
  portKey: port
  databaseKey: dbname
  usernameKey: user
  passwordKey: password
  sslMode: require

auth:
  session:
    cookieSecure: true
  initialAdmin:
    existingSecret: nexus-lens-initial-admin
    usernameKey: username
    passwordKey: password

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    queueAgeSeconds: 1800
    failedRuns24h: 1
    highVerificationFindings: 1
    cleanupRunningAgeSeconds: 3600
    cleanupFailedExecutions: 1
