openapi: 3.1.0
info:
  title: Nexus Lens API
  version: 0.0.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API health status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /api/v1/ready:
    get:
      operationId: getReady
      responses:
        "200":
          description: API readiness status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - basicAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated app user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/session:
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded and set the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid login request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteSession
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session cookie cleared.
  /api/v1/admin/status:
    get:
      operationId: getAdminStatus
      security:
        - basicAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Admin-only status endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/nexus-instances:
    get:
      operationId: listNexusInstances
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Configured Nexus instances.
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/NexusInstance"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/indexing-schedules:
    get:
      operationId: listIndexingSchedules
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: nexus_instance_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Indexing schedules.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndexingSchedule"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: upsertIndexingSchedule
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertIndexingScheduleRequest"
      responses:
        "200":
          description: Indexing schedule saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingSchedule"
        "400":
          description: Invalid schedule request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/nexus/{nexus_instance_id}/rate-limits:
    put:
      operationId: updateNexusRateLimits
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: nexus_instance_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateLimitSettings"
      responses:
        "200":
          description: Nexus rate limits saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingControl"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/retention-settings:
    get:
      operationId: getRetentionSettings
      security:
        - basicAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Effective retention settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionSettings"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: updateRetentionSettings
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionSettings"
      responses:
        "200":
          description: Retention settings saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionSettings"
        "400":
          description: Invalid retention settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/index/runs:
    get:
      operationId: listIndexRuns
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent index runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndexRun"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: startIndexRun
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIndexRunRequest"
      responses:
        "202":
          description: Index run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexRun"
        "400":
          description: Invalid run request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Index operation blocked by an active per-Nexus operation lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: nexus_instance_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Analytics overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/repositories:
    get:
      operationId: listRepositoryAnalytics
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Repository analytics rows.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepositoryAnalytics"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/images:
    get:
      operationId: listImageAnalytics
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryName"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Image analytics rows.
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageAnalytics"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/tags:
    get:
      operationId: listTagAnalytics
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryName"
        - $ref: "#/components/parameters/Search"
        - name: older_than_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: never_downloaded
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tag analytics rows.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagAnalytics"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/trends:
    get:
      operationId: listTrendSeries
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/MetricName"
        - $ref: "#/components/parameters/PatternName"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Gap-aware daily trend series.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrendPoint"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/packages/repositories:
    get:
      operationId: listPackageFormatRepositories
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Repository format support and discover-only package repository status.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackageFormatRepository"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/trends/top-movers:
    get:
      operationId: listTrendTopMovers
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/MetricName"
        - $ref: "#/components/parameters/PatternName"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Largest scoped metric deltas between two snapshot dates.
          content:
            application/json:
              schema:
                type: object
                required: [movers]
                properties:
                  movers:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrendTopMover"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cleanup/simulations:
    post:
      operationId: simulateCleanupPolicy
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupSimulationRequest"
      responses:
        "200":
          description: Read-only cleanup simulation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupSimulationResult"
        "400":
          description: Invalid cleanup policy YAML.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cleanup/executions:
    get:
      operationId: listCleanupExecutions
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent cleanup executions.
          content:
            application/json:
              schema:
                type: object
                required: [executions]
                properties:
                  executions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CleanupExecution"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: requestCleanupExecution
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupExecutionRequest"
      responses:
        "202":
          description: Cleanup execution request audited. Destructive execution may be blocked by read-only mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupExecution"
        "400":
          description: Invalid cleanup execution request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cleanup/executions/{cleanup_execution_id}/cancel:
    post:
      operationId: cancelCleanupExecution
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: cleanup_execution_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Cleanup execution canceled or cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupExecution"
        "400":
          description: Cleanup execution cannot be canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cleanup/executions/{cleanup_execution_id}/events:
    get:
      operationId: listCleanupExecutionEvents
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: cleanup_execution_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cleanup execution event log.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CleanupExecutionEvent"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/tag-patterns:
    get:
      operationId: listTagPatternAnalytics
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryName"
        - $ref: "#/components/parameters/OlderThanDays"
        - $ref: "#/components/parameters/NeverDownloaded"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tag pattern analytics rows.
          content:
            application/json:
              schema:
                type: object
                required: [patterns]
                properties:
                  patterns:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagPatternAnalytics"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/tag-patterns/growth:
    get:
      operationId: listTagPatternGrowth
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryName"
        - $ref: "#/components/parameters/PatternName"
        - $ref: "#/components/parameters/GrowthWindowDays"
        - $ref: "#/components/parameters/NeverDownloaded"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tag pattern growth rows grouped by repository, namespace, and pattern.
          content:
            application/json:
              schema:
                type: object
                required: [growth]
                properties:
                  growth:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagPatternGrowth"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/tag-patterns/examples:
    get:
      operationId: listTagPatternExamples
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryName"
        - $ref: "#/components/parameters/PatternName"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tag pattern example rows.
          content:
            application/json:
              schema:
                type: object
                required: [examples]
                properties:
                  examples:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagPatternExample"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analytics/tag-patterns/suggestions:
    get:
      operationId: listTagPatternSuggestions
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NexusInstanceID"
        - $ref: "#/components/parameters/RepositoryName"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Suggested tag pattern candidates from unclassified tags.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagPatternSuggestion"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/tag-patterns:
    get:
      operationId: listTagPatterns
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tag pattern definitions.
          content:
            application/json:
              schema:
                type: object
                required: [patterns]
                properties:
                  patterns:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagPattern"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: upsertTagPattern
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTagPatternRequest"
      responses:
        "200":
          description: Saved tag pattern definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPattern"
        "400":
          description: Invalid tag pattern request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/tag-patterns/reclassify:
    post:
      operationId: startTagReclassification
      security:
        - basicAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagReclassificationRequest"
      responses:
        "202":
          description: Tag reclassification run queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexRun"
        "400":
          description: Invalid reclassification request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/index/runs/{scan_run_id}/cancel:
    post:
      operationId: cancelIndexRun
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: scan_run_id
          in: path
          required: true
          schema:
            type: integer
