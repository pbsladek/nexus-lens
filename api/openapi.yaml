components:
  parameters:
    NexusInstanceID:
      name: nexus_instance_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    RepositoryName:
      name: repository_name
      in: query
      required: false
      schema:
        type: string
    RepositoryID:
      name: repository_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    ImageID:
      name: image_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    PatternName:
      name: pattern_name
      in: query
      required: false
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    MetricName:
      name: metric_name
      in: query
      required: false
      schema:
        type: string
        default: docker_logical_bytes
    StartDate:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date
    EndDate:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date
    OlderThanDays:
      name: older_than_days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    GrowthWindowDays:
      name: growth_window_days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 30
    NeverDownloaded:
      name: never_downloaded
      in: query
      required: false
      schema:
        type: boolean
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    sessionCookie:
      type: apiKey
      in: cookie
      name: nexus_lens_session
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    AppUser:
      type: object
      required: [username, role, capabilities]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, read_only]
        capabilities:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [username, role, capabilities, expires_at]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, read_only]
        capabilities:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    NexusInstance:
      type: object
      required: [id, name, base_url, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        base_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StartIndexRunRequest:
      type: object
      required: [scan_type]
      properties:
        nexus_name:
          type: string
        base_url:
          type: string
          format: uri
        scan_type:
          type: string
          enum: [recent_sync, bounded_reindex, full_reconcile, verification, trend_snapshot]
        task_key:
          type: string
        scope:
          $ref: '#/components/schemas/IndexRunScope'
    IndexRunScope:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: string
        window_days:
          type: integer
          minimum: 1
    IndexingSchedule:
      type: object
      required:
        - id
        - nexus_instance_id
        - nexus_name
        - nexus_base_url
        - scan_type
        - name
        - enabled
        - schedule_expr
        - interval_seconds
        - timezone
        - scope
        - lock_conflict_behavior
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        nexus_instance_id:
          type: integer
          format: int64
        nexus_name:
          type: string
        nexus_base_url:
          type: string
        scan_type:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        schedule_expr:
          type: string
        interval_seconds:
          type: integer
          format: int32
        timezone:
          type: string
        scope:
          $ref: "#/components/schemas/IndexRunScope"
        lock_conflict_behavior:
          type: string
        next_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpsertIndexingScheduleRequest:
      type: object
      required: [name, scan_type, interval_seconds, enabled]
      properties:
        nexus_name:
          type: string
        base_url:
          type: string
        name:
          type: string
        scan_type:
          type: string
          enum: [recent_sync, bounded_reindex, full_reconcile, verification, trend_snapshot]
        interval_seconds:
          type: integer
          format: int32
          minimum: 1
        enabled:
          type: boolean
